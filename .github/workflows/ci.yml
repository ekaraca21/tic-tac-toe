name: CI Pipeline (Tests)

# Wann soll die Pipeline starten?
on:
  push:
    branches:
      - 'feature/**'      # Für die späteren Branches
      - 'chore/**'        # Für Setup-Branches
      - 'add-ci-pipeline' # Startet jetzt auch bei deinem aktuellen Branch!

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Holt den Code aus eurem Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Installiert Java auf dem GitHub-Server
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Führt die Maven-Tests aus
      - name: Run Maven Tests
        run: mvn test